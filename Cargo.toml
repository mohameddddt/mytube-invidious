[package]
name = "mytube"
version = "1.1.0"
edition = "2024"
description = "My Tube - personal YouTube interface"
publish = false
build = "build.rs"

[[bin]]
name = "MyTube"
path = "src/main.rs"

[dependencies]
tiny_http = "0.12"
ureq = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# The app window (WebView2). These versions link through import libraries, so they build with the GNU toolchain
# as it comes (newer `windows` crates need a full MinGW for dlltool). Keep them in step: webview2-com 0.33 uses
# windows 0.58.
[target.'cfg(windows)'.dependencies]
webview2-com = "=0.33.0"
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader",
    "Win32_System_Registry", "Win32_System_WinRT", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
object = { version = "0.37", default-features = false, features = ["std", "write_core", "coff"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
