<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Tube</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f0a02e'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%231a1100'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="rail" id="nav" aria-label="Main">
  <a class="mark" href="#/" aria-label="My Tube home">&#9654;</a>
  <a href="#/" data-r="feed"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Feed</span></a>
  <a href="#/subs" data-r="subs"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg><span>Channels</span></a>
  <a href="#/later" data-r="later"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Later</span></a>
  <a href="#/history" data-r="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></a>
  <a href="#/downloads" data-r="downloads"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg><span>Saved</span></a>
  <a href="#/settings" data-r="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></a>
</nav>
<div class="shell">
  <header class="top">
    <form id="searchForm" class="search" autocomplete="off" role="search">
      <input id="q" type="search" placeholder="Search videos, channels, playlists" aria-label="Search" aria-controls="suggest">
      <div id="suggest" class="suggest" role="listbox" hidden></div>
      <button type="submit">Search</button>
    </form>
  </header>
  <main id="view" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
