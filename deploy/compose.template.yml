services:
  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        invidious_companion:
          - private_url: "http://companion:8282/companion"
            public_url: "http://localhost:8282/companion"
        invidious_companion_key: "PUT_COMPANION_KEY"
        hmac_key: "PUT_HMAC_KEY"
        channel_threads: 0
        feed_threads: 0
        popular_enabled: false
        statistics_enabled: false
        registration_enabled: false
        login_enabled: false
        captcha_enabled: false
        default_user_preferences:
          local: true
          quality: dash
          quality_dash: 720p
          autoplay: false
    logging:
      options: { max-size: "10m", max-file: "2" }
    depends_on:
      invidious-db:
        condition: service_healthy

  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    mem_limit: 300m
    environment:
      - SERVER_SECRET_KEY=PUT_COMPANION_KEY
    ports:
      - "127.0.0.1:8282:8282"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    logging:
      options: { max-size: "10m", max-file: "2" }

  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    mem_limit: 256m
    command: postgres -c shared_buffers=32MB -c effective_cache_size=128MB -c work_mem=2MB
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./config/sql:/config/sql
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      options: { max-size: "10m", max-file: "2" }

volumes:
  postgresdata:
  companioncache:
